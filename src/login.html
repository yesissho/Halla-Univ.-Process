<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>사번 로그인 | 제주한라대학교 AID사업단</title><link rel="stylesheet" href="/auth.css"></head><body><main class="auth-shell"><section class="intro"><img src="/campus.svg" alt="" width="64" height="64"><p class="eyebrow">제주한라대학교 AID사업단</p><h1>업무 진행 관리 도구</h1><p>계획부터 시행, 지급까지.<br>내 업무와 문서를 한곳에서 관리하세요.</p><div class="privacy"><span>01</span><div><b>사번으로 간편하게</b><p>처음 이용한다면 사번을 등록하고<br>본인만의 비밀번호를 설정하세요.</p></div></div><div class="privacy"><span>02</span><div><b>나의 문서만 안전하게</b><p>로그인한 사번으로 등록한 문서만 표시되며,<br>다른 PC에서도 이어서 관리할 수 있습니다.</p></div></div></section><section class="auth-card"><div class="tabs" role="tablist" aria-label="계정 이용"><button id="login-tab" role="tab" aria-selected="true">로그인</button><button id="register-tab" role="tab" aria-selected="false">사번 등록</button></div><h2 id="auth-title">업무를 이어서 시작하세요</h2><p id="auth-description">등록한 사번과 비밀번호를 입력해 주세요.</p><form id="auth-form"><label for="employee">사번</label><input id="employee" name="username" inputmode="numeric" autocomplete="username" pattern="[0-9]{3,20}" minlength="3" maxlength="20" placeholder="사번 입력" required><label for="password">비밀번호</label><input id="password" name="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" placeholder="비밀번호 입력" required><div id="confirmation" hidden><label for="confirm-password">비밀번호 확인</label><input id="confirm-password" type="password" autocomplete="new-password" minlength="8" maxlength="128" placeholder="비밀번호 다시 입력"></div><p id="auth-error" role="alert" hidden></p><button class="submit" id="auth-submit" type="submit">로그인</button></form><p class="hint" id="auth-hint">처음이신가요? 위의 사번 등록을 선택하세요.</p><a class="switch" id="switch-mode" href="#register">처음 이용합니다 · 사번 등록</a></section><footer>제주한라대학교 AID사업단 · 업무 진행 관리</footer></main><script src="/auth.js"></script></body></html>
